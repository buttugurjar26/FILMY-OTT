<!DOCTYPE html>
<html lang="en" id="htmlLang">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Movie Request | FILMY OTT</title>

<link rel="stylesheet" href="home.css">
<link rel="stylesheet" href="settings.css">

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

<style>

.request-page {
    padding: 25px 16px 100px;
}

.request-header {
    text-align: center;
    margin-bottom: 25px;
}

.request-header h2 {
    margin-bottom: 8px;
}

.request-header p {
    margin: 0;
    opacity: 0.75;
}

.request-form {
    max-width: 600px;
    margin: auto;
}

.request-form label {
    display: block;
    margin: 15px 0 7px;
    font-weight: 600;
}

.request-form input,
.request-form textarea {
    width: 100%;
    padding: 13px;
    border: 1px solid #d6b45c;
    border-radius: 10px;
    box-sizing: border-box;
    font-size: 15px;
    outline: none;
}

.request-form textarea {
    min-height: 120px;
    resize: vertical;
}

.request-button {
    width: 100%;
    margin-top: 20px;
    padding: 14px;
    border: none;
    border-radius: 10px;
    background: #d4af37;
    color: #fff;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.request-button:active {
    transform: scale(0.98);
}

</style>

</head>

<body>

<!-- HEADER -->

<header class="header">

<div class="brand">

<img src="logo-192.png" alt="FILMY OTT Logo">

<div>

<h2>FILMY OTT</h2>

<p>Premium Entertainment</p>

</div>

</div>

</header>


<!-- MOVIE REQUEST -->

<section class="request-page">

<div class="request-header">

<h2>🎬 <span data-lang="movieRequest">Movie Request</span></h2>

<p data-lang="movieRequestDescription">
Tell us which movie or web series you want to watch.
</p>

<label for="movieName" data-lang="movieWebSeriesName">
Movie / Web Series Name
</label>

<input
type="text"
id="movieName"
data-lang-placeholder="movieNamePlaceholder"
placeholder="Enter movie or web series name"
required
>

<label for="castName">
<span data-lang="actorActress">Actor / Actress</span>
<span style="opacity:0.6;" data-lang="optional">(Optional)</span>
</label>

<input
type="text"
id="castName"
data-lang-placeholder="castNamePlaceholder"
placeholder="Enter actor or actress name"
>

<label for="requestMessage">
<span data-lang="message">Message</span>
<span style="opacity:0.6;" data-lang="optional">(Optional)</span>
</label>

<textarea
id="requestMessage"
data-lang-placeholder="messagePlaceholder"
placeholder="Any additional information..."
></textarea>

<button
type="submit"
class="request-button"
>
🎬 <span data-lang="sendRequest">Send Request</span>
</button>

</form>

</section>


<!-- BOTTOM NAVIGATION -->

<i class="fa-solid fa-house"></i>

<span>Home</span>

</a>

<i class="fa-solid fa-film"></i>

<span>Movies</span>

</a>

<i class="fa-solid fa-magnifying-glass"></i>

<span>Search</span>

</a>

<a href="my-list.html">

<i class="fa-solid fa-heart"></i>

<span>My List</span>

</a>

<a href="settings.html">

<i class="fa-solid fa-gear"></i>

<span>Settings</span>

</a>

</nav>


<script type="module" src="movie-request.js"></script>

</body>

</html>
