<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banner Manager | FILMY OTT</title>
    <link rel="stylesheet" href="banner-manager.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
</head>

<body>

    <!-- HEADER -->
    <header class="header">
        <div class="brand">
            <img src="logo-192.png" alt="FILMY OTT">
            <div>
                <h2>FILMY OTT</h2>
                <p>Banner Manager</p>
            </div>
        </div>

        <button class="logout-btn" onclick="history.back()">
            <i class="fa-solid fa-arrow-left"></i>
            Back
        </button>
    </header>

    <!-- BANNER MANAGER SECTION -->
    <section class="banner-manager">

        <h2 class="section-title">
            🖼️ Select Banner Movies
        </h2>

        <!-- MOVIES GRID FOR BANNER SELECTION -->
        <div id="bannerMoviesGrid" class="movie-grid">
            <p class="loading-text">Loading Movies...</p>
        </div>

    </section>

    <!-- BANNER MANAGER JS -->
    <script type="module" src="banner-manager.js"></script>

</body>

</html>
