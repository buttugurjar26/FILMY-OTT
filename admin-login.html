<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | FILMY OTT</title>
    <link rel="stylesheet" href="admin-login.css?v=90">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
</head>

<body>

    <!-- HEADER -->
    <header class="header">
        <div class="brand">
            <img src="logo-192.png" alt="FILMY OTT Logo">
            <div>
                <h2>FILMY OTT</h2>
                <p>Premium Entertainment</p>
            </div>
        </div>

        <a href="settings.html" class="back-btn">
            <i class="fa-solid fa-arrow-left"></i>
            <span data-lang="back">Back</span>
        </a>
    </header>

    <!-- ADMIN LOGIN CONTAINER -->
    <section class="admin-login-section">
        <div class="admin-login-card">
            <img src="logo-192.png" alt="FILMY OTT">
            <h2>FILMY OTT</h2>
            <p>Admin Login</p>

            <input type="email" id="adminEmail" placeholder="Enter Email">
            <input type="password" id="adminPassword" placeholder="Enter Password">

            <button type="button" onclick="adminLogin()">Login</button>
            <p id="error"></p>
        </div>
    </section>

    <script src="admin-login.js"></script>

</body>
</html>
