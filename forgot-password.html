<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Forgot Password | FILMY OTT</title>

<link rel="stylesheet" href="home.css">
<link rel="stylesheet" href="forgot-password.css">

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

</head>

<body>

<!-- FORGOT PASSWORD -->

<section class="login">

<div class="login-card">

<img src="logo-192.png" class="login-logo" alt="FILMY OTT Logo">

<h2 data-lang="forgotPassword">
Forgot Password
</h2>

<p data-lang="forgotPasswordDescription">
Enter your registered email address to receive a password reset link.
</p>

<form id="forgotPasswordForm">

<div class="input-box">

<label data-lang="emailAddress">
Email Address
</label>

<input
type="email"
id="resetEmail"
placeholder="Enter your email"
data-lang-placeholder="enterEmail"
required>

</div>

<button
type="submit"
class="login-btn"
data-lang="sendResetLink">

Send Reset Link

</button>

<p class="signup-text">

<span data-lang="rememberPassword">
Remember your password?
</span>

<a href="login.html" data-lang="login">

Login

</a>

</p>

</form>

</div>

</section>

<!-- FORGOT PASSWORD SCRIPT -->

<script type="module" src="forgot-password.js"></script>

</body>

</html>
