<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Add Movie - FILMY OTT</title>

<link rel="stylesheet" href="add-movie.css">

<link
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
rel="stylesheet">

</head>

<body>


<header class="admin-header">

    <i class="fa-solid fa-film"></i>

    <h2>Add Movie</h2>

</header>


<section class="add-container">


    <!-- =========================
         MOVIE NAME
    ========================== -->

    <input
        type="text"
        id="movieName"
        placeholder="Movie Name"
        required
    >


    <!-- =========================
         DESCRIPTION
    ========================== -->

    <textarea
        id="movieDescription"
        placeholder="Movie Description"
        required
    ></textarea>


    <!-- =========================
         POSTER
    ========================== -->

    <label>

        Poster Upload

        <br>

        <small>
            Recommended Size: 1280 × 720 (16:9)
        </small>

    </label>

    <input
        type="file"
        id="moviePoster"
        accept="image/*"
        required
    >


    <!-- =========================
         TRAILER
    ========================== -->

    <label>

        Trailer Upload

        <br>

        <small>
            Trailer video Cloudinary पर upload होगा
        </small>

    </label>

    <input
        type="file"
        id="movieTrailer"
        accept="video/*"
        required
    >


    <!-- =========================
         WATCH MOVIE LINK
    ========================== -->

    <label>

        Watch Movie Link

        <br>

        <small>
            यह link Watch Movie button से खुलेगा
        </small>

    </label>

    <input
        type="url"
        id="watchMovieLink"
        placeholder="https://..."
        required
    >


    <!-- =========================
         CATEGORY
    ========================== -->

    <select
        id="movieCategory"
        required
    >

        <option value="">
            Select Category
        </option>

        <option value="Movie">🎬 Movie</option>
        <option value="Web Series">📺 Web Series</option>
        <option value="Action">🔥 Action</option>
        <option value="Romantic">❤️ Romantic</option>
        <option value="Comedy">😂 Comedy</option>
        <option value="Drama">🎭 Drama</option>
        <option value="Thriller">🔪 Thriller</option>
        <option value="Horror">👻 Horror</option>
        <option value="Crime">🚔 Crime</option>
        <option value="Sci-Fi">🚀 Sci-Fi</option>
        <option value="Animation">🧸 Animation</option>
        <option value="Documentary">🎥 Documentary</option>

    </select>


    <!-- =========================
         RELEASE YEAR
    ========================== -->

    <input
        type="number"
        id="movieYear"
        placeholder="Release Year"
        min="1900"
        max="2100"
        required
    >


    <!-- =========================
         CAST
    ========================== -->

    <div class="cast-section">

        <label>

            Cast

            <br>

            <small>
                जितने Cast चाहिए उतने Add Cast से जोड़ सकते हैं।
            </small>

        </label>


        <div id="castContainer"></div>


        <button
            type="button"
            id="addCastBtn"
            class="add-cast-btn"
        >

            <i class="fa-solid fa-user-plus"></i>

            Add Cast

        </button>

    </div>


    <!-- =========================
         SAVE MOVIE
    ========================== -->

    <button
        id="saveMovieBtn"
        onclick="saveMovie()"
    >

        <i class="fa-solid fa-upload"></i>

        Add Movie

    </button>


    <!-- =========================
         STATUS
    ========================== -->

    <p
        id="uploadStatus"
        class="upload-status"
    ></p>


</section>


<script
    type="module"
    src="add-movie.js"
></script>


</body>

</html>
