<!DOCTYPE html>
<html lang="en">

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Dashboard - Filmy OTT</title>

<link rel="stylesheet" href="admin-dashboard.css">

</head>


<body>


<header class="admin-header">

<h1>🎬 FILMY OTT Admin</h1>

</header>



<main class="dashboard">


<!-- STAT CARDS -->

<section class="stats">


<div class="card">

<h3>Total Movies</h3>

<p id="totalMovies">
0
</p>

</div>



<div class="card">

<h3>Total Users</h3>

<p id="totalUsers">
0
</p>

</div>



<div class="card">

<h3>Total Views</h3>

<p id="totalViews">
0
</p>

</div>



<div class="card">

<h3>Movies Added Today</h3>

<p id="todayMovies">
0
</p>

</div>



<div class="card">

<h3>Movies Added This Month</h3>

<p id="monthMovies">
0
</p>

</div>


</section>




<!-- LAST MOVIES -->


<section class="dashboard-box">


<h2>🎬 Last 5 Movies Added</h2>


<div id="lastMovies">

Loading Movies...

</div>


</section>





<!-- LAST USERS -->


<section class="dashboard-box">


<h2>👤 Last 5 New Users</h2>


<div id="lastUsers">

Loading Users...

</div>


</section>






<!-- NOTIFICATIONS -->


<section class="dashboard-box">


<h2>🔔 Last 5 Notifications</h2>


<div id="lastNotifications">

Loading Notifications...

</div>


</section>



</main>





<script type="module" src="admin-dashboard.js"></script>


</body>

</html>
