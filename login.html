<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | FILMY OTT</title>
    <link rel="stylesheet" href="login.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
</head>

<body>

    <!-- LOGIN SECTION -->
    <section class="login">

        <div class="login-card">

            <img src="logo-192.png" class="login-logo" alt="FILMY OTT Logo">

            <h2 data-lang="welcomeBack">
                Welcome Back
            </h2>

            <p data-lang="loginDescription">
                Login to continue watching your favourite Movies & Web Series.
            </p>

            <form id="loginForm">

                <div class="input-box">
                    <label data-lang="emailAddress">Email Address</label>
                    <input type="email" id="email" placeholder="Enter your email" data-lang-placeholder="enterEmail" autocomplete="email" spellcheck="false" required>
                </div>

                <div class="input-box">
                    <label data-lang="password">Password</label>
                    <div class="password-box">
                        <input type="password" id="password" placeholder="Enter your password" data-lang-placeholder="enterPassword" autocomplete="current-password" required>
                        <button type="button" id="togglePassword" class="eye-btn">
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="remember-row">
                    <label>
                        <input type="checkbox" id="rememberMe">
                        <span data-lang="keepSignedIn">Keep me signed in</span>
                    </label>
                    <a href="forgot-password.html" data-lang="forgotPassword">Forgot Password?</a>
                </div>

                <button type="submit" class="login-btn" data-lang="login">
                    Login
                </button>

                <p class="signup-text">
                    <span data-lang="dontHaveAccount">Don't have an account?</span>
                    <a href="signup.html" data-lang="createAccount">Create Account</a>
                </p>

            </form>

        </div>

    </section>

    <script type="module" src="login.js"></script>

</body>

</html>
