<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Movie Details | FILMY OTT</title>

<link rel="stylesheet" href="home.css">
<link rel="stylesheet" href="movie-details.css">

<link
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    rel="stylesheet"
>

</head>


<body>


<!-- =====================================
     HEADER
===================================== -->

<header class="header">

    <div class="brand">

        <img
            src="logo-192.png"
            alt="FILMY OTT"
        >

        <div>

            <h2>FILMY OTT</h2>

            <p>Premium Entertainment</p>

        </div>

    </div>


    <div
        class="profile"
        onclick="openProfile()"
    >

        <img
            id="headerProfile"
            src="avatar-1.png"
            alt="Profile"
        >

    </div>

</header>



<!-- =====================================
     MOVIE DETAILS
===================================== -->

<section class="movie-details">


    <!-- MOVIE POSTER / TRAILER -->

    <div class="movie-media">

        <img
            id="moviePoster"
            src="logo-192.png"
            alt="Movie Poster"
        >

    </div>



    <!-- MOVIE NAME -->

    <h1 id="movieName">
        Movie Name
    </h1>



    <!-- VIEWS -->

    <div class="movie-views">

        <i class="fa-solid fa-eye"></i>

        <span id="viewCount">
            0
        </span>

        <span>
            Views
        </span>

    </div>



    <!-- MOVIE INFORMATION -->

    <div class="info">

        <span id="movieCategory">
            Category
        </span>

        <span id="movieYear">
            2026
        </span>

        <span id="movieDuration">
            2h 30m
        </span>

        <span id="movieQuality">
            HD
        </span>

        <span id="movieLanguage">
            Hindi
        </span>

        <span id="movieRating">
            ⭐ 0.0
        </span>

    </div>



    <!-- =================================
         WATCH BUTTONS
    ================================= -->

    <div class="watch-buttons">


        <button
            id="trailerBtn"
            class="watch-button trailer-button"
            type="button"
        >

            <i class="fa-solid fa-film"></i>

            <span>
                Watch Trailer
            </span>

        </button>



        <button
            id="watchBtn"
            class="watch-button movie-button"
            type="button"
        >

            <i class="fa-solid fa-play"></i>

            <span>
                Watch Movie
            </span>

        </button>


    </div>



    <!-- =================================
         LIST | LIKE | SHARE | DOWNLOAD
    ================================= -->

    <div class="action-buttons">


        <button
            id="listBtn"
            type="button"
        >

            <i class="fa-solid fa-bookmark"></i>

            <span>
                List
            </span>

        </button>



        <button
            id="likeBtn"
            type="button"
        >

            <i class="fa-solid fa-thumbs-up"></i>

            <span>
                Like
            </span>

            <small id="likeCount">
                0
            </small>

        </button>



        <button
            id="shareBtn"
            type="button"
        >

            <i class="fa-solid fa-share-nodes"></i>

            <span>
                Share
            </span>

        </button>



        <button
            id="downloadBtn"
            type="button"
        >

            <i class="fa-solid fa-download"></i>

            <span>
                Download
            </span>

        </button>


    </div>



    <!-- =================================
         THREE TABS
         DETAILS | RATING | COMMENTS
    ================================= -->

    <div class="content-tabs">


        <button
            id="detailsTabBtn"
            class="content-tab active"
            type="button"
        >

            <i class="fa-solid fa-circle-info"></i>

            <span>
                Movie Details
            </span>

        </button>



        <button
            id="ratingTabBtn"
            class="content-tab"
            type="button"
        >

            <i class="fa-solid fa-star"></i>

            <span>
                Rating
            </span>

        </button>



        <button
            id="commentsTabBtn"
            class="content-tab"
            type="button"
        >

            <i class="fa-solid fa-comment"></i>

            <span>
                Comments
            </span>

            <small id="commentCount">
                0
            </small>

        </button>


    </div>



    <!-- =================================
         MOVIE DETAILS CONTENT
    ================================= -->

    <div
        id="detailsContent"
        class="tab-content active-content"
    >

        <h2>
            <i class="fa-solid fa-circle-info"></i>
            Movie Details
        </h2>

        <p id="movieDescription">

            Movie description will appear here.

        </p>

    </div>



    <!-- =================================
         RATING CONTENT
    ================================= -->

    <div
        id="ratingContent"
        class="tab-content"
    >

        <h2>
            <i class="fa-solid fa-star"></i>
            Public Rating
        </h2>


        <div class="stars">

            <i
                class="fa-solid fa-star"
                data-rate="1"
            ></i>

            <i
                class="fa-solid fa-star"
                data-rate="2"
            ></i>

            <i
                class="fa-solid fa-star"
                data-rate="3"
            ></i>

            <i
                class="fa-solid fa-star"
                data-rate="4"
            ></i>

            <i
                class="fa-solid fa-star"
                data-rate="5"
            ></i>

        </div>


        <p
            id="ratingMessage"
        >
            Tap a star to rate this movie.
        </p>

    </div>



    <!-- =================================
         COMMENTS CONTENT
         HIDDEN BY DEFAULT
    ================================= -->

    <div
        id="commentsContent"
        class="tab-content"
    >

        <h2>
            <i class="fa-solid fa-comments"></i>
            Comments
        </h2>


        <!-- COMMENT FORM -->

        <div class="comment-form">

            <textarea
                id="commentInput"
                rows="3"
                placeholder="Write a comment..."
            ></textarea>


            <button
                id="commentBtn"
                type="button"
            >

                <i class="fa-solid fa-paper-plane"></i>

                Post Comment

            </button>

        </div>


        <!-- COMMENTS LIST -->

        <div
            id="commentsList"
            class="comments-list"
        >

            <p class="no-comments">
                No comments yet.
            </p>

        </div>

    </div>


</section>



<!-- =====================================
     MORE LIKE THIS
===================================== -->

<section class="related-movies">

    <h2>

        <i class="fa-solid fa-film"></i>

        More Like This

    </h2>


    <div
        class="movie-row"
        id="relatedMovies"
    ></div>

</section>



<!-- =====================================
     BOTTOM NAVIGATION
===================================== -->

<nav class="bottom-nav">


    <a href="home.html">

        <i class="fa-solid fa-house"></i>

        <span>
            Home
        </span>

    </a>



    <a href="movies-list.html">

        <i class="fa-solid fa-film"></i>

        <span>
            Movies
        </span>

    </a>



    <a href="search.html">

        <i class="fa-solid fa-magnifying-glass"></i>

        <span>
            Search
        </span>

    </a>



    <a href="my-list.html">

        <i class="fa-solid fa-heart"></i>

        <span>
            My List
        </span>

    </a>



    <a href="settings.html">

        <i class="fa-solid fa-gear"></i>

        <span>
            Settings
        </span>

    </a>

</nav>



<script
    type="module"
    src="movie-details.js"
></script>


</body>

</html>
