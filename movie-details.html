<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Movie Details | FILMY OTT</title>

<link rel="stylesheet" href="home.css">
<link rel="stylesheet" href="movie-details.css">

<link
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
rel="stylesheet">

</head>

<script>
function openProfile() {
    window.location.href = "profile.html";
}
</script>

<body>

<!-- HEADER -->

<header class="header">

    <div class="brand">

        <img src="logo-192.png" alt="FILMY OTT">

        <div>
            <h2>FILMY OTT</h2>
            <p>Premium Entertainment</p>
        </div>

    </div>

    <div class="profile" onclick="openProfile()">
        <img id="headerProfile" src="avatar-1.png" alt="Profile">
    </div>

</header>


<!-- MOVIE DETAILS -->

<section class="movie-details">

    <img
        id="moviePoster"
        src="logo-192.png"
        alt="Movie Poster"
    >

    <h1 id="movieName">Movie Name</h1>

    <div class="info">

        <span id="movieCategory">Category</span>

        <span id="movieYear">2026</span>

        <span id="movieDuration">2h 30m</span>

        <span id="movieQuality">1080P</span>

        <span id="movieLanguage">Hindi</span>

        <span id="movieRating">⭐ 0.0</span>

    </div>

    <p id="movieDescription">
        Movie description will appear here.
    </p>


    <!-- TRAILER BUTTON -->

    <button id="trailerBtn" class="action-btn trailer-btn">

        <i class="fa-solid fa-film"></i>

        <span>Watch Trailer</span>

    </button>


    <!-- WATCH MOVIE -->

    <button id="watchBtn" class="action-btn watch-btn">

        <i class="fa-solid fa-play"></i>

        <span>Watch Movie</span>

    </button>


    <!-- DOWNLOAD MOVIE -->

    <button id="downloadBtn" class="action-btn download-btn">

        <i class="fa-solid fa-download"></i>

        <span>Download Movie</span>

    </button>


    <!-- MY LIST -->

    <button id="listBtn" class="action-btn list-btn">

        <i class="fa-solid fa-heart"></i>

        <span data-lang="addToMyList">
            Add to My List
        </span>

    </button>


    <!-- LIKE -->

    <button id="likeBtn" class="action-btn like-btn">

        <i class="fa-solid fa-thumbs-up"></i>

        <span>Like</span>

        <span id="likeCount">0</span>

    </button>


    <!-- SHARE -->

    <button id="shareBtn" class="action-btn share-btn">

        <i class="fa-solid fa-share-nodes"></i>

        <span data-lang="shareMovie">
            Share Movie
        </span>

    </button>


    <!-- VIEW COUNT -->

    <div class="movie-stats">

        <span>

            <i class="fa-solid fa-eye"></i>

            <span id="viewCount">0</span>

            Views

        </span>

        <span>

            <i class="fa-solid fa-comment"></i>

            <span id="commentCount">0</span>

            Comments

        </span>

    </div>

</section>



<!-- PUBLIC RATING -->

<section class="rating-box">

    <h3>
        ⭐
        <span data-lang="publicRating">
            Public Rating
        </span>
    </h3>

    <div class="stars">

        <i
            class="fa-solid fa-star"
            data-rate="1">
        </i>

        <i
            class="fa-solid fa-star"
            data-rate="2">
        </i>

        <i
            class="fa-solid fa-star"
            data-rate="3">
        </i>

        <i
            class="fa-solid fa-star"
            data-rate="4">
        </i>

        <i
            class="fa-solid fa-star"
            data-rate="5">
        </i>

    </div>

    <p id="ratingMessage" data-lang="tapToRate">
        Tap a star to rate this movie.
    </p>

</section>



<!-- COMMENTS -->

<section class="comments-section">

    <h2>

        <i class="fa-solid fa-comments"></i>

        Comments

    </h2>


    <!-- ADD COMMENT -->

    <div class="comment-form">

        <textarea
            id="commentInput"
            placeholder="Write a comment..."
            rows="3">
        </textarea>

        <button id="commentBtn">

            <i class="fa-solid fa-paper-plane"></i>

            Post Comment

        </button>

    </div>


    <!-- COMMENTS LIST -->

    <div
        id="commentsList"
        class="comments-list">

        <p class="no-comments">
            No comments yet.
        </p>

    </div>

</section>



<!-- RELATED MOVIES -->

<section class="related-movies">

    <h2>

        🎬

        <span data-lang="relatedMovies">
            Related Movies
        </span>

    </h2>

    <div
        class="movie-row"
        id="relatedMovies">
    </div>

</section>



<!-- BOTTOM NAVIGATION -->

<nav class="bottom-nav">

    <a href="home.html">

        <i class="fa-solid fa-house"></i>

        <span data-lang="home">
            Home
        </span>

    </a>


    <a href="movies-list.html">

        <i class="fa-solid fa-film"></i>

        <span data-lang="movies">
            Movies
        </span>

    </a>


    <a href="search.html">

        <i class="fa-solid fa-magnifying-glass"></i>

        <span data-lang="search">
            Search
        </span>

    </a>


    <a href="my-list.html">

        <i class="fa-solid fa-heart"></i>

        <span data-lang="myList">
            My List
        </span>

    </a>


    <a href="settings.html">

        <i class="fa-solid fa-gear"></i>

        <span data-lang="settings">
            Settings
        </span>

    </a>

</nav>



<!-- MOVIE DETAILS JS -->

<script
    type="module"
    src="movie-details.js">
</script>

</body>

</html>
