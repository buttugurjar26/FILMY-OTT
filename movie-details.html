<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Details - FILMY OTT</title>
    <link rel="stylesheet" href="home.css">
    <link rel="stylesheet" href="movie-details.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

    <!-- HEADER -->
    <header class="header">
        <div class="brand">
            <img src="logo-192.png" alt="FILMY OTT Logo">
            <div>
                <h2>FILMY OTT</h2>
                <p>Premium Entertainment</p>
            </div>
        </div>
        <div class="profile" onclick="openProfile()">
            <img id="headerProfile" src="default-profile.png" alt="Profile">
        </div>
    </header>

    <!-- MOVIE DETAILS CONTAINER -->
    <div class="movie-details">

        <!-- MOVIE MEDIA (POSTER & TRAILER VIDEO) -->
        <div class="movie-media">
            <img id="moviePoster" src="logo-192.png" alt="Movie Poster">
            <video id="trailerVideo" controls playsinline style="display: none;">
                <source id="videoSource" src="" type="video/mp4">
                Your browser does not support the video tag.
            </video>
        </div>

        <!-- MOVIE TITLE & VIEWS -->
        <h1 id="movieName">Loading...</h1>
        <div class="movie-views">
            <i class="fa-solid fa-eye"></i>
            <span id="viewCount">0</span> <span data-lang="views">Views</span>
        </div>

        <!-- MOVIE INFO TAGS -->
        <div class="info">
            <span id="movieCategory">Category</span>
            <span id="movieYear">2026</span>
            <span id="movieDuration">0h 0m</span>
            <span id="movieQuality">HD</span>
            <span id="movieLanguage">Hindi</span>
            <span id="movieRating">⭐ 0.0</span>
        </div>

        <!-- WATCH BUTTONS -->
        <div class="watch-buttons">
            <button id="trailerBtn" class="watch-button trailer-button">
                <i class="fa-solid fa-film"></i>
                <span data-lang="watchTrailer">Watch Trailer</span>
            </button>
            <button id="watchBtn" class="watch-button movie-button">
                <i class="fa-solid fa-play"></i>
                <span data-lang="watchMovie">Watch Movie</span>
            </button>
        </div>

        <!-- FOUR ACTION BUTTONS -->
        <div class="action-buttons">
            <button id="likeBtn">
                <i class="fa-solid fa-heart"></i>
                <div class="btn-text">
                    <small id="likeCount">0</small>
                    <span data-lang="like">Like</span>
                </div>
            </button>

            <!-- MY LIST BUTTON -->
            <button id="listBtn">
                <i id="listBtnIcon" class="fa-solid fa-plus"></i>
                <small id="listBtnText" data-lang="save">Save</small>
            </button>

            <button id="castBtn">
                <i class="fa-solid fa-users"></i>
                <small data-lang="cast">Cast</small>
            </button>

            <button id="shareBtn">
                <i class="fa-solid fa-share-nodes"></i>
                <small data-lang="share">Share</small>
            </button>
        </div>

        <!-- INLINE CAST CONTAINER -->
        <div id="castContent" class="cast-content" style="display: none;">
            <div id="castList" class="cast-list">
                <!-- Dynamic Cast Cards will be loaded here -->
            </div>
        </div>

        <!-- CONTENT TABS -->
        <div class="content-tabs">
            <button id="detailsTabBtn" class="content-tab active">
                <i class="fa-solid fa-circle-info"></i>
                <span data-lang="movieDetails">Movie Details</span>
            </button>

            <button id="ratingTabBtn" class="content-tab">
                <i class="fa-solid fa-star"></i>
                <span data-lang="rating">Rating</span>
            </button>

            <button id="commentsTabBtn" class="content-tab">
    <i class="fa-solid fa-comments"></i>
    <span data-lang="comments">Comments</span>
    <small id="commentCount">0</small>
</button>
        </div>

        <!-- TAB CONTENT: DETAILS -->
        <div id="detailsContent" class="tab-content active-content">
            <h2>
                <i class="fa-solid fa-circle-info"></i>
                <span data-lang="description">Description</span>
            </h2>
            <p id="movieDescription">Loading description...</p>
        </div>

        <!-- TAB CONTENT: RATING -->
        <div id="ratingContent" class="tab-content" style="display: none;">
            <h2>
                <i class="fa-solid fa-star"></i>
                <span data-lang="rateMovie">Rate This Movie</span>
            </h2>
            <div class="stars">
                <i class="fa-solid fa-star" data-rate="1"></i>
                <i class="fa-solid fa-star" data-rate="2"></i>
                <i class="fa-solid fa-star" data-rate="3"></i>
                <i class="fa-solid fa-star" data-rate="4"></i>
                <i class="fa-solid fa-star" data-rate="5"></i>
            </div>
            <p id="ratingMessage" data-lang="tapToRate">Tap a star to give rating</p>
        </div>

        <!-- TAB CONTENT: COMMENTS -->
        <div id="commentsContent" class="tab-content" style="display: none;">
            <h2>
                <i class="fa-solid fa-comments"></i>
                <span data-lang="userComments">User Comments</span>
            </h2>
            <div class="comment-form">
                <textarea id="commentInput" placeholder="Write a comment..." data-lang-placeholder="commentPlaceholder"></textarea>
                <button id="commentBtn" data-lang="postComment">Post Comment</button>
            </div>
            <div id="commentsList" class="comments-list"></div>
        </div>

    </div>

    <!-- RELATED MOVIES SECTION -->
    <section class="related-movies">
        <h2>
            <i class="fa-solid fa-film"></i>
            <span data-lang="relatedMovies">Related Movies</span>
        </h2>
        
        <div id="relatedMovies" class="movie-row"></div>

        <div class="view-more-container">
            <button id="viewMoreBtn" data-lang="viewMore">View More →</button>
        </div>
    </section>

    <!-- BOTTOM NAVIGATION -->
    <nav class="bottom-nav">
        <a href="home.html">
            <i class="fa-solid fa-house"></i>
            <span data-lang="home">Home</span>
        </a>

        <a href="movies-list.html" class="active">
            <i class="fa-solid fa-film"></i>
            <span data-lang="movies">Movies</span>
        </a>

        <a href="search.html">
            <i class="fa-solid fa-magnifying-glass"></i>
            <span data-lang="search">Search</span>
        </a>

        <a href="my-list.html">
            <i class="fa-solid fa-heart"></i>
            <span data-lang="myList">My List</span>
        </a>

        <a href="settings.html">
            <i class="fa-solid fa-gear"></i>
            <span data-lang="settings">Settings</span>
        </a>
    </nav>

    <!-- SCRIPT -->
    <script type="module" src="movie-details.js"></script>
</body>
</html>
