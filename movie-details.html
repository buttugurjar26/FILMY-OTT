<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Movie Details | FILMY OTT</title>

<link rel="stylesheet" href="home.css">
<link rel="stylesheet" href="movie-details.css">

<link
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
rel="stylesheet">

</head>


<script>
function openProfile() {
    window.location.href = "profile.html";
}
</script>


<body>


<!-- =====================================
     HEADER
===================================== -->

<header class="header">

    <div class="brand">

        <img
            src="logo-192.png"
            alt="FILMY OTT"
        >

        <div>

            <h2>FILMY OTT</h2>

            <p>Premium Entertainment</p>

        </div>

    </div>


    <div
        class="profile"
        onclick="openProfile()"
    >

        <img
            id="headerProfile"
            src="avatar-1.png"
            alt="Profile"
        >

    </div>

</header>



<!-- =====================================
     MOVIE DETAILS
===================================== -->

<section class="movie-details">


    <!-- MOVIE POSTER -->

    <img
        id="moviePoster"
        src="logo-192.png"
        alt="Movie Poster"
    >


    <!-- MOVIE NAME -->

    <h1 id="movieName">
        Movie Name
    </h1>


    <!-- MOVIE INFORMATION -->

    <div class="info">

        <span id="movieCategory">
            Category
        </span>

        <span id="movieYear">
            2026
        </span>

        <span id="movieDuration">
            2h 30m
        </span>

        <span id="movieQuality">
            HD
        </span>

        <span id="movieLanguage">
            Hindi
        </span>

        <span id="movieRating">
            ⭐ 0.0
        </span>

    </div>



    <!-- =================================
         WATCH TRAILER
    ================================== -->

    <button
        id="trailerBtn"
        class="action-btn trailer-btn"
    >

        <i class="fa-solid fa-film"></i>

        <span>
            Watch Trailer
        </span>

    </button>



    <!-- =================================
         WATCH MOVIE
    ================================== -->

    <button
        id="watchBtn"
        class="action-btn watch-btn"
    >

        <i class="fa-solid fa-play"></i>

        <span>
            Watch Movie
        </span>

    </button>



    <!-- =================================
         FOUR ACTION BUTTONS
         ONE LINE
    ================================== -->

    <div class="action-buttons">


        <!-- LIST -->

        <button
            id="listBtn"
            class="small-action-btn"
        >

            <i class="fa-solid fa-bookmark"></i>

            <span>
                List
            </span>

        </button>



        <!-- LIKE -->

        <button
            id="likeBtn"
            class="small-action-btn"
        >

            <i class="fa-solid fa-thumbs-up"></i>

            <span>
                Like
            </span>

            <small id="likeCount">
                0
            </small>

        </button>



        <!-- SHARE -->

        <button
            id="shareBtn"
            class="small-action-btn"
        >

            <i class="fa-solid fa-share-nodes"></i>

            <span>
                Share
            </span>

        </button>



        <!-- DOWNLOAD -->

        <button
            id="downloadBtn"
            class="small-action-btn"
        >

            <i class="fa-solid fa-download"></i>

            <span>
                Download
            </span>

        </button>


    </div>



<!-- =================================
     MOVIE DETAILS | VIEWS | COMMENTS
================================= -->

<div class="details-action-buttons">

    <!-- MOVIE DETAILS -->

    <button
        type="button"
        id="detailsTabBtn"
        class="details-action-btn active"
    >

        <i class="fa-solid fa-circle-info"></i>

        <span>
            Movie Details
        </span>

    </button>


    <!-- VIEWS -->

    <button
        type="button"
        id="viewsBtn"
        class="details-action-btn"
    >

        <i class="fa-solid fa-eye"></i>

        <span>
            <b id="viewCount">0</b>
            Views
        </span>

    </button>


    <!-- COMMENTS -->

    <button
        type="button"
        id="commentsBtn"
        class="details-action-btn"
    >

        <i class="fa-solid fa-comment"></i>

        <span>
            <b id="commentCount">0</b>
            Comments
        </span>

    </button>

</div>



    <!-- =================================
         DESCRIPTION
    ================================== -->

    <div class="description-box">

        <p id="movieDescription">

            Movie description will appear here.

        </p>

    </div>


</section>



<!-- =====================================
     PUBLIC RATING
===================================== -->

<section class="rating-box">


    <h3>

        ⭐

        <span data-lang="publicRating">
            Public Rating
        </span>

    </h3>


    <div class="stars">


        <i
            class="fa-solid fa-star"
            data-rate="1"
        ></i>


        <i
            class="fa-solid fa-star"
            data-rate="2"
        ></i>


        <i
            class="fa-solid fa-star"
            data-rate="3"
        ></i>


        <i
            class="fa-solid fa-star"
            data-rate="4"
        ></i>


        <i
            class="fa-solid fa-star"
            data-rate="5"
        ></i>


    </div>


    <p
        id="ratingMessage"
        data-lang="tapToRate"
    >

        Tap a star to rate this movie.

    </p>


</section>



<!-- =====================================
     COMMENTS
===================================== -->

<section class="comments-section">


    <h2>

        <i class="fa-solid fa-comments"></i>

        Comments

    </h2>



    <!-- COMMENT FORM -->

    <div class="comment-form">


        <textarea
            id="commentInput"
            placeholder="Write a comment..."
            rows="3"
        ></textarea>



        <button id="commentBtn">

            <i class="fa-solid fa-paper-plane"></i>

            Post Comment

        </button>


    </div>



    <!-- COMMENTS LIST -->

    <div
        id="commentsList"
        class="comments-list"
    >

        <p class="no-comments">

            No comments yet.

        </p>

    </div>


</section>



<!-- =====================================
     MORE LIKE THIS
===================================== -->

<section class="related-movies">


    <h2>

        🎬

        <span data-lang="relatedMovies">
            More Like This
        </span>

    </h2>


    <div
        class="movie-row"
        id="relatedMovies"
    ></div>


</section>



<!-- =====================================
     BOTTOM NAVIGATION
===================================== -->

<nav class="bottom-nav">


    <!-- HOME -->

    <a href="home.html">

        <i class="fa-solid fa-house"></i>

        <span data-lang="home">
            Home
        </span>

    </a>



    <!-- MOVIES -->

    <a href="movies-list.html">

        <i class="fa-solid fa-film"></i>

        <span data-lang="movies">
            Movies
        </span>

    </a>



    <!-- SEARCH -->

    <a href="search.html">

        <i class="fa-solid fa-magnifying-glass"></i>

        <span data-lang="search">
            Search
        </span>

    </a>



    <!-- MY LIST -->

    <a href="my-list.html">

        <i class="fa-solid fa-heart"></i>

        <span data-lang="myList">
            My List
        </span>

    </a>



    <!-- SETTINGS -->

    <a href="settings.html">

        <i class="fa-solid fa-gear"></i>

        <span data-lang="settings">
            Settings
        </span>

    </a>


</nav>



<!-- =====================================
     MOVIE DETAILS JAVASCRIPT
===================================== -->

<script
    type="module"
    src="movie-details.js"
></script>


</body>

</html>
