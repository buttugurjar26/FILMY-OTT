<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Player | FILMY OTT</title>

<link rel="stylesheet" href="home.css">
<link rel="stylesheet" href="player.css">

<link
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
rel="stylesheet">

</head>

<body>


<!-- ===========================
     HEADER
=========================== -->

<header class="header">

    <div class="brand">

        <img
        src="logo-192.png"
        alt="FILMY OTT">

        <div>

            <h2>FILMY OTT</h2>

            <p>Premium Entertainment</p>

        </div>

    </div>


    <div
    class="profile"
    onclick="history.back()">

        <i class="fa-solid fa-arrow-left"></i>

    </div>

</header>



<!-- ===========================
     PLAYER SECTION
=========================== -->

<section class="player-section">


    <!-- PLAYER CONTAINER -->

    <div class="player-container">


        <!-- VIDEO -->

        <video
    id="videoPlayer"
    controls
    controlsList="nodownload"
    playsinline
    webkit-playsinline
    poster="logo-192.png">
             
            Your browser does not support the video tag.

        </video>



        <!-- ===========================
             CUSTOM VIDEO CONTROLS
        =========================== -->

        <div
        class="video-overlay"
        id="videoOverlay">


            <!-- CENTER CONTROLS -->

            <div class="overlay-center">


                <button id="backwardBtn">

                    <i class="fa-solid fa-rotate-left"></i>

                </button>


                <button id="playPauseBtn">

                    <i class="fa-solid fa-play"></i>

                </button>


                <button id="forwardBtn">

                    <i class="fa-solid fa-rotate-right"></i>

                </button>


            </div>



            <!-- BOTTOM CONTROLS -->

            <div class="overlay-bottom">


                <input
                type="range"
                id="progressBar"
                value="0"
                min="0"
                max="100">


                <div class="bottom-controls">


                    <span id="currentTime">
                        00:00
                    </span>


                    <button id="fullscreenBtn">

                        <i class="fa-solid fa-expand"></i>

                    </button>
                     


                    <span id="totalTime">
                        00:00
                    </span>


                </div>

            </div>


        </div>


    </div>



    <!-- ===========================
         MOVIE DETAILS
         PLAYER KE BAHAR
    =========================== -->

    <section class="movie-details">


        <h1 id="movieTitle">

            Movie Name

        </h1>


        <div class="info">


            <span id="movieGenre">

                Category

            </span>


            <span id="movieYear">

                2026

            </span>


            <span id="movieLanguage">

                Hindi

            </span>


        </div>


    </section>


</section>



<!-- ===========================
     RELATED MOVIES
=========================== -->

<section class="related-section">


    <h2>

        🎬

        <span data-lang="relatedMovies">

            Related Movies

        </span>

    </h2>


    <div
    class="movie-row"
    id="relatedMovies">

    </div>


</section>



<!-- ===========================
     LOADING
=========================== -->

<div
class="loading"
id="loading">


    <i class="fa-solid fa-spinner fa-spin"></i>


    <span data-lang="loadingVideo">

        Loading Video...

    </span>


</div>



<!-- ===========================
     BOTTOM NAVIGATION
=========================== -->

<nav class="bottom-nav">


    <a href="home.html">

        <i class="fa-solid fa-house"></i>

        <span data-lang="home">
            Home
        </span>

    </a>


    <a href="movies-list.html">

        <i class="fa-solid fa-film"></i>

        <span data-lang="movies">
            Movies
        </span>

    </a>


    <a href="search.html">

        <i class="fa-solid fa-magnifying-glass"></i>

        <span data-lang="search">
            Search
        </span>

    </a>


    <a href="my-list.html">

        <i class="fa-solid fa-heart"></i>

        <span data-lang="myList">
            My List
        </span>

    </a>


    <a href="settings.html">

        <i class="fa-solid fa-gear"></i>

        <span data-lang="settings">
            Settings
        </span>

    </a>


</nav>



<!-- ===========================
     PLAYER JS
=========================== -->

<script
type="module"
src="player.js">
</script>



<!-- ===========================
     OVERLAY AUTO HIDE
=========================== -->

<script>

const playerContainer =
document.querySelector(".player-container");

const overlay =
document.getElementById("videoOverlay");

let hideControls;


if(playerContainer && overlay){

    playerContainer.addEventListener(
        "click",
        (event) => {

            /*
             * Button/input click par
             * unnecessary toggle avoid karein
             */

            if(
                event.target.closest("button") ||
                event.target.closest("input")
            ){

                return;

            }


            overlay.classList.toggle("show");


            clearTimeout(
                hideControls
            );


            hideControls =
            setTimeout(
                () => {

                    overlay.classList.remove(
                        "show"
                    );

                },
                3000
            );

        }
    );

}

</script>


</body>

</html>
