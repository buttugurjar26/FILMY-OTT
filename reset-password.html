<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Reset Password | FILMY OTT</title>

<link rel="stylesheet" href="home.css">
<link rel="stylesheet" href="reset-password.css">

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

</head>

<body>

<!-- RESET PASSWORD -->

<section class="login">

<div class="login-card">

<img src="logo-192.png" class="login-logo" alt="FILMY OTT Logo">

<h2 data-lang="resetPassword">
Reset Password
</h2>

<p data-lang="resetPasswordDescription">
Create a new password for your FILMY OTT account.
</p>

<form id="resetPasswordForm">

<div class="input-box">

<label data-lang="newPassword">
New Password
</label>

<div class="password-box">

<input
type="password"
id="newPassword"
placeholder="Enter new password"
data-lang-placeholder="enterNewPassword"
required>

<button
type="button"
id="toggleNewPassword"
class="eye-btn">

<i class="fa-solid fa-eye"></i>

</button>

</div>

</div>

<div class="input-box">

<label data-lang="confirmNewPassword">
Confirm New Password
</label>

<div class="password-box">

<input
type="password"
id="confirmPassword"
placeholder="Confirm new password"
data-lang-placeholder="confirmNewPasswordPlaceholder"
required>

<button
type="button"
id="toggleConfirmPassword"
class="eye-btn">

<i class="fa-solid fa-eye"></i>

</button>

</div>

</div>

<button
type="submit"
class="login-btn"
data-lang="updatePassword">

Update Password

</button>

<p class="signup-text">

<span data-lang="rememberPassword">
Remember your password?
</span>

<a href="login.html" data-lang="login">

Login

</a>

</p>

</form>

</div>

</section>

<script type="module" src="reset-password.js"></script>

</body>

</html>
