<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Content Manager | FILMY OTT</title>

<link rel="stylesheet" href="content-manager.css">

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

</head>

<body>

<!-- HEADER -->

<header class="header">

<div class="brand">

<img src="logo-192.png" alt="FILMY OTT">

<div>

<h2>FILMY OTT</h2>

<p>Content Manager</p>

</div>

</div>

<button class="logout-btn" onclick="history.back()">

<i class="fa-solid fa-arrow-left"></i>

Back

</button>

</header>


<!-- CONTENT OPTIONS -->

<section class="admin-container">

<div class="admin-card" onclick="location.href='banner-manager.html'">

<div class="card-icon">

<i class="fa-solid fa-images"></i>

</div>

<h2>Banner Manager</h2>

<p>Manage Home Banners</p>

</div>


<div class="admin-card"
onclick="location.href='featured-movies.html'">

<div class="card-icon">

<i class="fa-solid fa-star"></i>

</div>

<h2>Featured Movies</h2>

<p>Show Featured Content</p>

</div>


<div class="admin-card" onclick="location.href='trending-movies.html'">

<div class="card-icon">

<i class="fa-solid fa-fire"></i>

</div>

<h2>Trending Movies</h2>

<p>Manage Trending Section</p>

</div>


<div class="admin-card" onclick="location.href='latest-movies.html'">

<div class="card-icon">

<i class="fa-solid fa-clock"></i>

</div>

<h2>Latest Movies</h2>

<p>Latest Releases</p>

</div>


<div class="admin-card" onclick="location.href='coming-soon.html'">

<div class="card-icon">

<i class="fa-solid fa-calendar-days"></i>

</div>

<h2>Coming Soon</h2>

<p>Upcoming Movies</p>

</div>

</section>

<script src="content-manager.js"></script>

</body>

</html>
